name: Deploy HLHFM + Eidolon-Ω

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies - HLHFM
        run: |
          cd hlhfm-core
          pip install -r requirements.txt

      - name: Install dependencies - Eidolon
        run: |
          cd eidolon-inference
          pip install -r requirements.txt

      - name: Run HLHFM tests
        run: |
          cd hlhfm-core
          python -m pytest tests/ || echo "No tests found"

      - name: Run Eidolon tests
        run: |
          cd eidolon-inference
          python -m pytest tests/ || echo "No tests found"

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build HLHFM Core
        run: |
          cd hlhfm-core
          docker build -t hlhfm-core:latest .

      - name: Build Eidolon Inference
        run: |
          cd eidolon-inference
          docker build -t eidolon-inference:latest .

      - name: Build Preprocessor
        run: |
          cd preprocessor
          docker build -t preprocessor:latest .

      - name: Build Evaluator
        run: |
          cd evaluator
          docker build -t evaluator:latest .

      - name: Build API Gateway
        run: |
          cd api-gateway
          docker build -t api-gateway:latest .

      - name: Test Docker Compose
        run: |
          docker-compose config

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure kubectl
        run: |
          echo "Kubectl configuration would go here"
          echo "kubectl config set-context ..."

      - name: Deploy Redis
        run: |
          kubectl apply -f k8s/redis-deployment.yaml || echo "Deployment skipped (configure kubectl first)"

      - name: Deploy HLHFM Core
        run: |
          kubectl apply -f k8s/hlhfm-deployment.yaml || echo "Deployment skipped (configure kubectl first)"

      - name: Deploy Eidolon Inference
        run: |
          kubectl apply -f k8s/eidolon-deployment.yaml || echo "Deployment skipped (configure kubectl first)"

      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml || echo "Deployment skipped (configure kubectl first)"

      - name: Wait for deployments
        run: |
          echo "kubectl rollout status deployment/hlhfm-core"
          echo "kubectl rollout status deployment/eidolon-inference"
