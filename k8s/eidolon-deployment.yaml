apiVersion: apps/v1
kind: Deployment
metadata:
  name: eidolon-inference
  labels:
    app: eidolon-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eidolon-inference
  template:
    metadata:
      labels:
        app: eidolon-inference
    spec:
      containers:
      - name: eidolon-inference
        image: eidolon-inference:latest
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: ONNX_MODEL_PATH
          value: "/app/eidolon.onnx"
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
          limits:
            memory: "16Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eidolon-inference-service
spec:
  selector:
    app: eidolon-inference
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eidolon-inference-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eidolon-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
