global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hlhfm-core'
    static_configs:
      - targets: ['hlhfm-core:8000']
    metrics_path: '/metrics'

  - job_name: 'eidolon-inference'
    static_configs:
      - targets: ['eidolon-inference:8001']
    metrics_path: '/metrics'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
