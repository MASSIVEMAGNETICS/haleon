apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlhfm-core
  labels:
    app: hlhfm-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hlhfm-core
  template:
    metadata:
      labels:
        app: hlhfm-core
    spec:
      containers:
      - name: hlhfm-core
        image: hlhfm-core:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: HLHFM_DIM
          value: "512"
        - name: HLHFM_DECAY_RATE
          value: "0.1"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hlhfm-core-service
spec:
  selector:
    app: hlhfm-core
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
